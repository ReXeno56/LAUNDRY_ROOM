<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="theme-color" content="#f5f7f3">
  <title>交大洗衣状态</title>
  <script src="{{ url_for('static', filename='preferences.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='laundry.css') }}">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div class="brand-mark" aria-hidden="true"><span class="machine-icon"></span></div>
      <div class="header-copy">
        <h1>洗衣状态</h1>
        <p class="subtitle">上海交通大学 · 闵行校区</p>
      </div>
      <label class="theme-picker">
        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.5 8.5 0 0 1 9.8 4 8.5 8.5 0 1 0 20 14.2Z"/></svg>
        <select id="theme-mode" aria-label="主题模式">
          <option value="system">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </label>
    </header>
    <nav class="building-picker" aria-label="选择楼栋">
      <span class="eyebrow">选择楼栋</span>
      <div class="tabs" id="building-tabs"></div>
    </nav>
    <section class="overview" aria-label="设备状态概览">
      <div class="availability">
        <span class="eyebrow" id="availability-title">现在空闲</span>
        <div class="available-number"><span id="idle-count">—</span><span class="count-unit">台</span></div>
        <p class="available-detail" id="available-detail">正在获取设备状态</p>
      </div>
      <div class="secondary-stats">
        <div class="stat"><span class="stat-label"><i class="status-dot running-dot"></i>使用中</span><span class="stat-number" id="running-count">—</span></div>
        <div class="stat"><span class="stat-label"><i class="status-dot error-dot"></i>异常 / 离线</span><span class="stat-number" id="error-count">—</span></div>
      </div>
    </section>
    <aside id="reservation-info" class="reservation-info" role="status" hidden>
      <div><strong id="reservation-title"></strong><span id="reservation-updated"></span></div>
      <p id="reservation-warning"></p>
      <a id="reservation-source" target="_blank" rel="noopener noreferrer" hidden>查看预约文档 ↗</a>
    </aside>
    <div class="list-toolbar">
      <div class="list-heading"><h2>设备列表</h2><span class="data-status" id="data-status">正在加载</span></div>
      <button type="button" class="refresh-button" id="refresh-button" aria-label="刷新设备状态">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 17.9 17"/></svg><span>刷新</span>
      </button>
    </div>
    <div class="list-filters">
      <button type="button" class="idle-filter" id="idle-filter" aria-pressed="false"><span class="filter-dot" aria-hidden="true"></span><span id="idle-filter-label">仅看空闲</span></button>
      <span class="sort-hint" id="sort-hint">空闲优先 · 按结束时间排序</span>
    </div>
    <div id="error-banner" class="error-banner" role="status" hidden></div>
    <button type="button" id="retry-button" class="retry-button" hidden>重新加载</button>
    <div id="content" aria-live="polite" aria-busy="true">
      <div class="placeholder"><span class="loading-ring" aria-hidden="true"></span><p>正在查询设备</p><span>稍等一下，马上就好</span></div>
    </div>
    <footer class="page-footer">
      <p class="refresh" id="refresh-info"></p>
      <p class="calendar-hint" id="calendar-hint">使用中的设备可添加到日历提醒。下载后请完成导入，并允许日历通知。</p>
    </footer>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script id="laundry-config" type="application/json">{{ public_config|tojson }}</script>
  <script src="{{ url_for('static', filename='native-reminders.js') }}" defer></script>
  <script src="{{ url_for('static', filename='main.js') }}" defer></script>
</body>
</html>
